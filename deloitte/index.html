<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Late for the Party | concept game by Minikurser</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Concept for a small Christmas pixel game for mobile. Built by Minikurser. Not an official Deloitte product.">
<meta name="author" content="Minikurser">
<meta property="og:site_name" content="Minikurser">
<meta property="og:title" content="Late for the Party">
<meta property="og:description" content="Concept game by Minikurser: run through the city, the office and the party before 18:00.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://minikurser.dk/deloitte/">
<meta property="og:image" content="https://minikurser.dk/deloitte/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Late for the Party">
<link rel="icon" href="/img/favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b1026; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; display: flex; flex-direction: column;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: Montserrat, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #game { flex: 1; min-height: 0; width: 100%; }
  #game canvas { image-rendering: pixelated; display: block; }
  #rotate { display: none; color: #f6f1e6; text-align: center; padding: 14px 16px 22px; font-size: 16px; line-height: 1.4; }
  #rotate b { color: #ffcf3b; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  noscript { color: #f6f1e6; padding: 24px; display: block; }
  #splash { position: fixed; inset: 0; z-index: 20; background: #2a2847; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; transition: opacity .5s; color: #f2f2f2; }
  #splash img { width: min(18vw, 18vh, 90px); height: auto; }
  #splash p { margin: 0; font-size: 15px; letter-spacing: .25em; text-transform: uppercase; }
  #splash small { font-size: 11px; letter-spacing: .08em; color: #b8b7c8; }
  #splash.gone { opacity: 0; pointer-events: none; }
  #rotate img { width: 40px; display: block; margin: 0 auto 10px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><img src="/img/minikurser-symbol-hvid.png" alt="Minikurser"><b>Turn your phone.</b><br>The game is made for landscape.</div>
<div id="splash" role="img" aria-label="Minikurser presents"><img src="/img/minikurser-symbol-hvid.png" alt="Minikurser"><p>Minikurser presents</p><small>Concept game. Not an official Deloitte product.</small></div>
<noscript>The game needs JavaScript.</noscript>
<script>
// Minikursers logo vises, mens spillet hentes, og mindst halvandet sekund
(function () {
  var t0 = Date.now();
  window.__hideSplash = function () {
    var el = document.getElementById('splash');
    if (!el) return;
    setTimeout(function () { el.classList.add('gone'); setTimeout(function () { el.remove(); }, 600); }, Math.max(0, 1500 - (Date.now() - t0)));
  };
})();
(function load(urls) {
  if (!urls.length) { window.__hideSplash(); document.getElementById('rotate').style.display = 'block'; document.getElementById('rotate').textContent = 'The game engine could not be loaded. Check your connection and try again.'; return; }
  var s = document.createElement('script');
  s.src = urls[0];
  s.onload = function () { import('./src/main.js'); };
  s.onerror = function () { load(urls.slice(1)); };
  document.head.appendChild(s);
})(["vendor/phaser.min.js", "https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js", "https://unpkg.com/phaser@4.2.1/dist/phaser.min.js"]);
</script>
</body>
</html>
