<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<title>Nå julefrokosten | FRB+ julespil</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Et lille julespil til mobilen for kollegerne på Campusadministrationen Frederiksberg+. En julegave fra Kasper.">
<meta name="author" content="Kasper Bergstrøm">
<meta property="og:site_name" content="Nå julefrokosten">
<meta property="og:title" content="Nå julefrokosten">
<meta property="og:description" content="Løb gennem campus, kontoret og julefrokosten, før klokken bliver 14.30. Afdelingerne dyster om pokalen.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://minikurser.dk/frb/">
<meta property="og:image" content="https://minikurser.dk/frb/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nå julefrokosten">
<link rel="icon" href="assets/avatar.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b1026; overflow: hidden; overscroll-behavior: none; }
  body {
    position: fixed; inset: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; display: flex; flex-direction: column;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: Montserrat, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  #game { flex: 1; min-height: 0; width: 100%; }
  #game canvas { image-rendering: pixelated; display: block; }
  #rotate { display: none; color: #f6f1e6; text-align: center; padding: 14px 16px 22px; font-size: 16px; line-height: 1.4; }
  #rotate b { color: #ffcf3b; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: block; } }
  noscript { color: #f6f1e6; padding: 24px; display: block; }
  #splash { position: fixed; inset: 0; z-index: 20; background: #5a0a0e; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; transition: opacity .5s; color: #f2f2f2; }
  #splash img { height: min(48vh, 300px); width: auto; }
  #splash p { margin: 0; font-size: clamp(20px, 4.5vh, 30px); font-weight: 700; letter-spacing: .06em; }
  #splash small { font-size: clamp(14px, 3vh, 19px); letter-spacing: .04em; color: #f2d6d2; }
  #splash.gone { opacity: 0; pointer-events: none; }
  /* juleagtig indlæsning: en bolsjestang, der langsomt fyldes op */
  #load { width: min(60vw, 280px); height: 16px; margin-top: 6px; border: 2px solid #ffcf3b; border-radius: 10px;
    background: #3a0608; overflow: hidden; box-shadow: 0 0 12px rgba(255, 207, 59, .25); }
  #load i { display: block; height: 100%; width: 0; border-radius: 8px;
    background: repeating-linear-gradient(-45deg, #f6f4ee 0 8px, #c73028 8px 16px); background-size: 22.6px 22.6px;
    animation: fill 3.4s cubic-bezier(.3, .1, .3, 1) forwards, stripes .9s linear infinite; }
  #load.done i { width: 100% !important; animation: stripes .9s linear infinite; transition: width .35s ease-out; }
  @keyframes fill { from { width: 0; } to { width: 92%; } }
  @keyframes stripes { from { background-position: 0 0; } to { background-position: 22.6px 0; } }
  @media (prefers-reduced-motion: reduce) { #load i { animation: fill 3.4s linear forwards; } }
  #rotate img { width: 40px; display: block; margin: 0 auto 10px; }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotate"><img src="assets/avatar.png" alt="" style="width:80px"><b>Vend telefonen.</b><br>Spillet er lavet til at ligge ned.</div>
<div id="splash" role="img" aria-label="En julegave fra Kasper"><img src="assets/avatar.png" alt="Kasper med nissehue"><p>En julegave fra Kasper</p><div id="load" aria-hidden="true"><i></i></div></div>
<noscript>Spillet kræver JavaScript.</noscript>
<script>
// Kasper vises, mens spillet hentes, og mindst tre et halvt sekund, så alle kan se, hvem gaven er fra
(function () {
  var t0 = Date.now();
  window.__hideSplash = function () {
    var el = document.getElementById('splash');
    if (!el) return;
    var wait = Math.max(0, 3500 - (Date.now() - t0));
    setTimeout(function () {
      var bar = document.getElementById('load');
      if (bar) bar.classList.add('done');   // bolsjestangen fyldes helt op, før skærmen forsvinder
      setTimeout(function () { el.classList.add('gone'); setTimeout(function () { el.remove(); }, 600); }, 450);
    }, wait);
  };
})();
(function load(urls) {
  if (!urls.length) { window.__hideSplash(); document.getElementById('rotate').style.display = 'block'; document.getElementById('rotate').textContent = 'Spillet kunne ikke hentes. Tjek forbindelsen og prøv igen.'; return; }
  var s = document.createElement('script');
  s.src = urls[0];
  s.onload = function () { import('./src/main.js'); };
  s.onerror = function () { load(urls.slice(1)); };
  document.head.appendChild(s);
})(["vendor/phaser.min.js", "https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js", "https://unpkg.com/phaser@4.2.1/dist/phaser.min.js"]);
</script>
</body>
</html>
