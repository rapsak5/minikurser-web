<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <!-- Kasper som tegnet avatar med nissehue: krøllet brunt hår, briller, overskæg, mørk blazer og hvid T-shirt. Fri fortolkning. -->
