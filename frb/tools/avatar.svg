  <ellipse cx="298" cy="324" rx="16" ry="10" fill="#f0a08c" opacity="0.5"/>
  <path d="M200 342 C214 328 232 330 240 338 C248 330 266 328 280 342 C266 348 252 346 240 342 C228 346 214 348 200 342 Z" fill="#6b4a2e"/>
