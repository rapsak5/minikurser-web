    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2343c"/><stop offset="1" stop-color="#a8141e"/></linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43434b"/><stop offset="1" stop-color="#2c2c33"/></linearGradient>
  </defs>
  <!-- krop -->
  <path d="M70 560 C72 470 120 420 180 404 L300 404 C360 420 408 470 410 560 Z" fill="url(#blazer)"/>
  <path d="M196 404 L240 470 L284 404 Z" fill="#f6f4ee"/>
