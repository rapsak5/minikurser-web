<script>
(()=>{'use strict';
/* ============================================================
   ODDEREN REDDER HAVET  ·  prototype v0.3
   Tegnes i 320x180 "fede pixels" (art) og 640x360 (tekst/UI).
   ============================================================ */
const W=640,H=360,AW=320,AH=180;
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const stage=document.getElementById('stage'),cv=document.getElementById('c'),sx=cv.getContext('2d');
const buf=mkc(W,H),b=buf.getContext('2d');
const art=mkc(AW,AH),a=art.getContext('2d');
b.imageSmoothingEnabled=false;a.imageSmoothingEnabled=false;

/* ---------- små hjælpere ---------- */
const R=(ctx,x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
/* afrundet kasse i pixelstil */
function rr(ctx,x,y,w,h,r,c){x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);if(w<=0||h<=0)return;r=Math.max(0,Math.min(r|0,w>>1,h>>1));ctx.fillStyle=c;if(!r){ctx.fillRect(x,y,w,h);return}
 ctx.fillRect(x,y+r,w,h-2*r);for(let j=0;j<r;j++){const dy=r-j-.5,ins=Math.round(r-Math.sqrt(r*r-dy*dy));ctx.fillRect(x+ins,y+j,w-2*ins,1);ctx.fillRect(x+ins,y+h-1-j,w-2*ins,1)}}
const hex=c=>{const n=parseInt(c.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const mod=(n,m)=>((n%m)+m)%m;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function ell(ctx,cx,cy,rx,ry,col){ctx.fillStyle=col;for(let y=Math.ceil(cy-ry);y<=Math.floor(cy+ry);y++){const dy=(y-cy)/ry;const hw=rx*Math.sqrt(Math.max(0,1-dy*dy));const x0=Math.round(cx-hw),x1=Math.round(cx+hw);if(x1>x0)ctx.fillRect(x0,y,x1-x0,1)}}
function line(ctx,x0,y0,x1,y1,col){ctx.fillStyle=col;x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sxx=x0<x1?1:-1,syy=y0<y1?1:-1;let e=dx+dy;for(;;){ctx.fillRect(x0,y0,1,1);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sxx}if(e2<=dx){e+=dx;y0+=syy}}}
function gradV(ctx,x0,y0,w,h,stops){const id=ctx.createImageData(w,h),d=id.data;for(let y=0;y<h;y++){const t=y/(h-1||1);let i=0;while(i<stops.length-2&&t>stops[i+1][0])i++;const A=hex(stops[i][1]),B=hex(stops[i+1][1]);const f=(t-stops[i][0])/(stops[i+1][0]-stops[i][0]);for(let x=0;x<w;x++){const th=(BAYER[(y&3)*4+(x&3)]+.5)/16;const c=f>th?B:A;const p=(y*w+x)*4;d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2];d[p+3]=255}}ctx.putImageData(id,x0,y0)}
function outl(c,col){const w=c.width,h=c.height,s=c.getContext('2d').getImageData(0,0,w,h).data;const o=mkc(w+2,h+2),x=o.getContext('2d');x.fillStyle=col;const op=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&s[(j*w+i)*4+3]>127;for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++){if(!op(i,j)&&(op(i-1,j)||op(i+1,j)||op(i,j-1)||op(i,j+1)))x.fillRect(i+1,j+1,1,1)}x.drawImage(c,1,1);return o}
function sp(rows,pal,ol){const h=rows.length,w=rows[0].length;const c=mkc(w,h),x=c.getContext('2d');rows.forEach((r,y)=>{for(let i=0;i<w;i++){const ch=r[i];if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}});return ol?outl(c,ol):c}
function draw(w,h,fn,ol){const c=mkc(w,h);fn(c.getContext('2d'));return ol?outl(c,ol):c}
function wrap(str,max){const out=[];let cur='';for(const w of str.split(' ')){if((cur+' '+w).trim().length>max){out.push(cur);cur=w}else cur=(cur+' '+w).trim()}if(cur)out.push(cur);return out}
const DARK='#141a3a',INK='#2a1a14',YEL='#ffcf3b',GOLD='#f5c518',GREEN='#6ae088',RED='#ff4a5a';

'%':'##..#/##..#/...#./..#../.#.../#..##/#..##','<':'...#/..#./.#../#.../.#../..#./...#','>':'#.../.#../..#./...#/..#./.#../#...'
};
const F={};for(const k in FD){const rows=FD[k].split('/');F[k]={rows,w:rows[0].length,up:rows.length===9}}
const glyph=ch=>F[ch]||F['?'];
function measure(str,sc=1,bold=0){let w=0;for(const ch of String(str))w+=(glyph(ch).w+1)*sc+bold;return Math.max(0,w-sc)}
const tcache=new Map();
function tcanvas(str,sc,col,o,ow,sh,bold){const key=str+'|'+sc+col+o+ow+sh+bold;let c=tcache.get(key);if(c)return c;if(tcache.size>700)tcache.clear();
  const pad=o?ow:0;c=mkc(measure(str,sc,bold)+pad*2+1,9*sc+pad*2+sh);const x=c.getContext('2d');
  const raw=(dx,dy,color)=>{x.fillStyle=color;let cx=pad+dx;for(const ch of str){const g=glyph(ch),off=g.up?0:2;g.rows.forEach((row,ry)=>{let run=0;for(let i=0;i<=row.length;i++){if(row[i]==='#')run++;else{if(run)x.fillRect(cx+(i-run)*sc,pad+dy+(ry+off)*sc,run*sc+bold,sc);run=0}}});cx+=(g.w+1)*sc+bold}};
  if(o){if(sh)for(let dx=-1;dx<=1;dx++)raw(dx*ow,ow+sh,o);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)raw(dx*ow,dy*ow,o)}
  raw(0,0,col);c.pad=pad;tcache.set(key,c);return c}
/* T: y er toppen af versalhøjden. Å får sin ring ovenover. */
function T(str,x,y,opt={}){str=String(str);const sc=opt.s||1;const c=tcanvas(str,sc,opt.c||'#fff',opt.o||'',opt.ow||(sc>=3?2:1),opt.sh||0,opt.b||0);const w=c.width-c.pad*2-1;let dx=x;if(opt.a==='c')dx=x-(w>>1);else if(opt.a==='r')dx=x-w;b.drawImage(c,Math.round(dx-c.pad),Math.round(y-c.pad-2*sc));return w}
const P=(x,y,w,h,c,r=7)=>rr(b,x,y,w,h,r,c||'rgba(14,20,46,.86)');
function frame(x,y,w,h,border,fill,r=8){rr(b,x,y,w,h,r,border);rr(b,x+2,y+2,w-4,h-4,Math.max(0,r-2),fill)}

/* ---------- ikoner ---------- */

 down:[9,9,(x,c)=>{for(let i=0;i<5;i++)R(x,4-i,8-i,1+2*i,1,c);R(x,3,0,3,4,c)}],
 sound:[14,12,(x,c)=>{R(x,0,4,3,4,c);for(let i=0;i<4;i++)R(x,3+i,3-i,1,6+2*i,c);R(x,9,4,1,4,c);R(x,8,3,1,1,c);R(x,8,8,1,1,c);R(x,12,2,1,8,c);R(x,11,1,1,1,c);R(x,11,10,1,1,c)}],
 mute:[14,12,(x,c)=>{R(x,0,4,3,4,c);for(let i=0;i<4;i++)R(x,3+i,3-i,1,6+2*i,c);for(let k=0;k<5;k++){R(x,9+k,3+k,1,2,c);R(x,13-k,3+k,1,2,c)}}],
 whirl:[15,15,(x,c)=>{for(let an=0;an<3.75*Math.PI;an+=.02){const r=.6+an*.55;R(x,Math.round(7+Math.cos(an)*r),Math.round(7+Math.sin(an)*r),1,1,c)}R(x,6,6,3,3,c)}],
 replay:[13,13,(x,c)=>{for(let an=0;an<6.283;an+=.02){if(an>4.5&&an<5.7)continue;for(const r of[4.2,5.3])R(x,Math.round(6+Math.cos(an)*r),Math.round(6+Math.sin(an)*r),1,1,c)}R(x,5,0,2,5,c);R(x,7,1,1,3,c);R(x,8,2,1,1,c)}],
 check:[11,9,(x,c)=>{line(x,0,4,3,7,c);line(x,0,5,3,8,c);line(x,3,7,10,0,c);line(x,3,8,10,1,c)}],
 cross:[9,9,(x,c)=>{line(x,0,0,8,8,c);line(x,1,0,8,7,c);line(x,0,1,7,8,c);line(x,8,0,0,8,c);line(x,7,0,0,7,c);line(x,8,1,1,8,c)}],
 lock:[9,11,(x,c)=>{R(x,2,0,5,1,c);R(x,1,1,1,4,c);R(x,7,1,1,4,c);R(x,0,5,9,6,c);R(x,4,7,1,2,DARK)}],
 globe:[13,13,(x)=>{ell(x,6.5,6.5,6.5,6.5,'#3484e4');ell(x,4,4,2.8,2.2,'#52c060');ell(x,9,8.5,2.2,2.8,'#52c060');R(x,3,2,2,1,'#a8d4ff')}]
};
const ICN={};
function icon(n,c='#fff',ol){const k=n+c+(ol||'');if(ICN[k])return ICN[k];const[w,h,f]=ICONDEF[n];return ICN[k]=draw(w,h,x=>f(x,c),ol)}
function ic(n,x,y,sc=2,c,ol){const s=icon(n,c,ol);b.drawImage(s,Math.round(x),Math.round(y),s.width*sc,s.height*sc);return s.width*sc}

/* knap med ikon og/eller tekst */
function btn(x,y,w,h,o){const on=o.on!==false,isc=o.isc||2,sc=o.sc||2;
 rr(b,x,y+3,w,h,9,'#070a1e');frame(x,y,w,h,on?'#8a6a10':'#2c3352',on?YEL:'#3e4770',9);if(on)R(b,x+9,y+3,w-18,2,'#ffe58a');
 const col=on?DARK:'#dfe5fa';const icv=o.icon?icon(o.icon,col):null;const iw=icv?icv.width*isc:0;const lw=o.label?measure(o.label,sc):0;const gap=icv&&o.label?8:0;let cx=x+(w-iw-gap-lw)/2;
 if(icv){b.drawImage(icv,Math.round(cx),Math.round(y+(h-icv.height*isc)/2),iw,icv.height*isc);cx+=iw+gap}
 if(o.label)T(o.label,cx,y+Math.round((h-7*sc)/2),{s:sc,c:col});
 if(o.fn)Z(x-5,y-5,w+10,h+12,o.fn)}
