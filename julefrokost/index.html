(function () {

    if (!el) return;
    setTimeout(function () { el.classList.add('gone'); setTimeout(function () { el.remove(); }, 600); }, Math.max(0, 1500 - (Date.now() - t0)));
  };
})();
(function load(urls) {

  s.onload = function () { import('./src/main.js'); };
  s.onerror = function () { load(urls.slice(1)); };
  document.head.appendChild(s);
})(["vendor/phaser.min.js", "https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js", "https://unpkg.com/phaser@4.2.1/dist/phaser.min.js"]);
